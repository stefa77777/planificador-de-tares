<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas Diarias</title>
    <link rel="stylesheet" href="Style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTt7R5lVFaLwnll3TaP_a8R_R76PgXZHmYkWWJ3i27mNA&s=10" alt="Logo Planificador de Tareas" class="logo-app" width="30" height="30">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Tareas Diarias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card p-4 shadow">
                    <h3 class="card-title text-center mb-4 text-primary fw-bold">Nueva Tarea</h3>
                    
                    <div id="errorContainer" class="alert alert-danger d-none" role="alert"></div>

                    <form id="taskForm">

                        <div class="mb-3">
                            <label for="taskName" class="form-label">Nombra tu tarea</label>
                            <input type="text" class="form-control" id="taskName" placeholder="Ej. Hacer tareas de matemáticas">
                        </div>

                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Descripción</label>
                            <textarea class="form-control" id="taskDescription" rows="3" placeholder="Descripción detallada de la tarea"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="taskAssignee" class="form-label">Asignado a</label>
                            <input type="text" class="form-control" id="taskAssignee" placeholder="Nombre del responsable">
                        </div>

                        <div class="mb-3">
                            <label for="taskDueDate" class="form-label">Fecha de Entrega</label>
                            <input type="date" class="form-control" id="taskDueDate">
                        </div>

                        <div class="mb-3">
                            <label for="taskStatus" class="form-label">Estado</label>
                            <select class="form-select" id="taskStatus">
                                <option value="" selected disabled>Selecciona un estado</option>
                                <option value="POR HACER">Por Hacer</option>
                                <option value="EN PROCESO">En Proceso</option>
                                <option value="REVISIÓN">Revisión</option>
                                <option value="HECHO">Hecho</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Guardar Tarea</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="row mt-5" id="tasksContainer">
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
